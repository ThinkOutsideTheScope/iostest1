name: iOS Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # Change these to match your project.
  SCHEME: IosTest1
  PROJECT: IosTest1.xcodeproj   # use WORKSPACE below instead if you use CocoaPods or a .xcworkspace
  # WORKSPACE: IosTest1.xcworkspace

jobs:
  build-test-ipa:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      # Uncomment if you generate the .xcodeproj with XcodeGen.
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an available iPhone simulator
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^ *(.*) \([0-9A-F-]{36}\).*/\1/')
          echo "Using simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore

      - name: Archive unsigned app for devices
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/$SCHEME.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package .ipa
        run: |
          APP_PATH=$(find "build/$SCHEME.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in the archive" >&2
            exit 1
          fi
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (cd build && zip -qry "$SCHEME-unsigned.ipa" Payload)
          ls -lh build/*.ipa

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SCHEME }}-unsigned-ipa
          path: build/${{ env.SCHEME }}-unsigned.ipa
          if-no-files-found: error