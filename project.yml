name: IosTest1

options:
  bundleIdPrefix: com.example   # change to your own reverse-domain prefix
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  IosTest1:
    type: application
    platform: iOS
    sources:
      - IosTest1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IosTest1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    # Generates a shared "IosTest1" scheme that also runs the test target.
    scheme:
      testTargets:
        - IosTest1Tests

  IosTest1Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - IosTest1Tests
    dependencies:
      - target: IosTest1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.IosTest1Tests
        GENERATE_INFOPLIST_FILE: YES